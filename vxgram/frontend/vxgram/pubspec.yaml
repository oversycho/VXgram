name: vxgram
description: VXGram - Instagram-style app (Flutter + Supabase + BLoC)
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.3.0 <4.0.0'
dependencies:
  flutter: {sdk: flutter}
  flutter_localizations: {sdk: flutter}
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  supabase_flutter: ^2.5.0
  shared_preferences: ^2.3.0
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.0
  video_player: ^2.9.0
  share_plus: ^10.0.0
  image_picker: ^1.1.2
  image: ^4.2.0
  video_thumbnail: ^0.5.6
dev_dependencies:
  flutter_test: {sdk: flutter}
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
